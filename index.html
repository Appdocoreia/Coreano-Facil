
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b55d9">
<meta name="description" content="Aprenda coreano de um jeito fácil e divertido.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Coreano Fácil</title>
<style>
:root{--ink:#24243b;--muted:#77778f;--purple:#625ce7;--lav:#efeeff;--line:#ececf4;--bg:#f7f7fc;--green:#159768;--red:#c94d62}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#625ce7,#8b75ef);color:white;padding:26px 20px 32px;border-radius:0 0 28px 28px}
.wrap{max-width:780px;margin:auto}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13px}
h1{font-size:30px;line-height:1.2;margin:25px 0 8px}
header p{margin:0;opacity:.9}
main{max-width:780px;margin:-12px auto 30px;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat,.panel,.tile{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px #29265b08}
.stat strong{display:block;font-size:21px}
.stat span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;overflow-x:auto;padding:18px 0 12px}
nav button,.subnav button{border:0;border-radius:999px;background:#eae9f8;color:#555276;padding:10px 15px;font-weight:700;white-space:nowrap}
nav button.active,.subnav button.active{background:var(--purple);color:white}
.panel{padding:18px;margin:8px 0 14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:19px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.progress{height:9px;background:#eeedf7;border-radius:9px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:#61c99c}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:14px;text-align:left;cursor:pointer;color:inherit;width:100%}
.tile .emoji{font-size:24px}
.tile b{display:block;margin:6px 0 3px}
.tile small{color:var(--muted)}
button{cursor:pointer;font:inherit}
.primary{background:var(--purple);color:white;border:0;border-radius:12px;padding:11px 15px;font-weight:700}
.secondary{background:var(--lav);color:var(--purple);border:1px solid #dedcff;border-radius:12px;padding:10px 13px;font-weight:700}
.lesson{border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0;background:white}
.lesson h3{font-size:16px;margin:0 0 5px}
.lesson p{margin:4px 0;color:var(--muted);font-size:14px}
.korean{font-size:27px;font-weight:800;letter-spacing:1px}
.answer{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:white;padding:12px;margin:8px 0}
.answer:hover{border-color:var(--purple);background:var(--lav)}
.feedback-area{text-align:center;padding:24px 16px;margin:20px 0;background:white;border:1px solid var(--line);border-radius:18px}
.feedback-link{display:inline-block;padding:14px 24px;background:#6d5ce7;color:white;border-radius:12px;text-decoration:none;font-weight:bold}
.feedback-area p{font-size:13px;color:var(--muted);margin-bottom:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.char-card{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 8px;text-align:center;min-width:0}
.char-card .letter{font-size:34px;font-weight:850;line-height:1.3}
.char-card .sound{font-size:13px;color:var(--muted);min-height:19px}
.char-card button{margin-top:8px;border:0;background:var(--lav);color:var(--purple);border-radius:10px;padding:7px 10px;font-weight:700}
.tag{display:inline-block;font-size:11px;color:#625ce7;background:#efeeff;padding:4px 8px;border-radius:999px;font-weight:700}
.notice{padding:12px;border-radius:12px;background:#f5f4ff;color:#555276;font-size:13px;margin:12px 0}
.quiz-prompt{background:#f8f7ff;border:1px solid #e8e6ff;border-radius:16px;text-align:center;padding:22px 12px;margin:14px 0}
.quiz-prompt .korean{font-size:38px}
.correct{background:#e1f7ed!important;border-color:#8bd8b6!important}
.wrong{background:#ffe9ec!important;border-color:#f0aab5!important}
.tiny{font-size:12px;color:var(--muted)}
.feedback-link:focus,button:focus-visible{outline:3px solid #bcb8ff;outline-offset:2px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.char-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="top"><span>🇰🇷 COREANO FÁCIL</span><span>🇧🇷 Para quem fala português</span></div>
<h1>안녕하세요!<br>Vamos aprender coreano?</h1>
<p>Pequenos passos todos os dias. 💜</p>
</div>
</header>

<main>
<div class="stats">
<div class="stat"><strong id="xp">0</strong><span>⭐ XP acumulado</span></div>
<div class="stat"><strong id="done">0/30</strong><span>📚 Lições concluídas</span></div>
<div class="stat"><strong id="level">1</strong><span>🏅 Seu nível</span></div>
</div>

<nav id="tabs">
<button class="active" data-tab="inicio">Início</button>
<button data-tab="hangul">Hangul</button>
<button data-tab="vocabulario">Vocabulário</button>
<button data-tab="licoes">Lições</button>
<button data-tab="quiz">Quiz</button>
</nav>

<section id="content" aria-live="polite"></section>

<div class="feedback-area">
<a class="feedback-link" href="https://docs.google.com/forms/d/e/1FAIpQLSfM4YlJV9QZAVRQ1kqn2OSLUUZwna47-JadYb-3S9EKQmwIHA/viewform" target="_blank" rel="noopener noreferrer">⭐ Avaliar aplicativo</a>
<p>Sua opinião é importante para nós!</p>
</div>
</main>

<footer>Coreano Fácil · Feito com carinho para estudantes de coreano</footer>

<script>
'use strict';

const lessons=[
["Cumprimentos","안녕하세요","Olá / Bom dia"],
["Apresentações","저는 마리아예요","Eu sou Maria"],
["Obrigado","감사합니다","Obrigado(a)"],
["Desculpas","죄송합니다","Desculpe"],
["Sim e não","네 / 아니요","Sim / Não"],
["Família","가족","Família"],
["Números 1","하나, 둘, 셋","Um, dois, três"],
["Números 2","일, 이, 삼","Um, dois, três (sino-coreano)"],
["Comida","밥","Arroz / refeição"],
["Água","물 주세요","Água, por favor"],
["Café","커피","Café"],
["Restaurante","맛있어요","Está delicioso"],
["Tempo","오늘","Hoje"],
["Dias","월요일","Segunda-feira"],
["Lugares","학교","Escola"],
["Transporte","버스","Ônibus"],
["Compras","얼마예요?","Quanto custa?"],
["Cores","빨간색","Vermelho"],
["Adjetivos","좋아요","É bom / gosto"],
["Verbos","가요","Vou / vai"],
["Casa","집","Casa"],
["Trabalho","일","Trabalho"],
["Estudos","공부해요","Estudo"],
["Hobbies","음악","Música"],
["Clima","날씨","Clima"],
["Sentimentos","행복해요","Estou feliz"],
["Localização","어디예요?","Onde fica?"],
["Pedido","도와주세요","Ajude-me, por favor"],
["Passado","갔어요","Fui"],
["Revisão","한국어를 공부해요","Estudo coreano"]
];

const vocab=[
["안녕하세요","Olá"],
["감사합니다","Obrigado(a)"],
["사랑","Amor"],
["친구","Amigo(a)"],
["물","Água"],
["밥","Arroz / refeição"],
["학교","Escola"],
["책","Livro"],
["집","Casa"],
["가족","Família"],
["네","Sim"],
["아니요","Não"],
["사람","Pessoa"],
["한국","Coreia"],
["커피","Café"],
["고양이","Gato"],
["강아지","Cachorro"],
["시간","Tempo / hora"],
["오늘","Hoje"],
["내일","Amanhã"]
];

const vowelBasic=[
{c:"ㅏ",s:"a",a:"아"},
{c:"ㅑ",s:"ya",a:"야"},
{c:"ㅓ",s:"eo",a:"어"},
{c:"ㅕ",s:"yeo",a:"여"},
{c:"ㅗ",s:"o",a:"오"},
{c:"ㅛ",s:"yo",a:"요"},
{c:"ㅜ",s:"u",a:"우"},
{c:"ㅠ",s:"yu",a:"유"},
{c:"ㅡ",s:"eu",a:"으"},
{c:"ㅣ",s:"i",a:"이"}
];

const vowelCompound=[
{c:"ㅐ",s:"ae",a:"애"},
{c:"ㅒ",s:"yae",a:"얘"},
{c:"ㅔ",s:"e",a:"에"},
{c:"ㅖ",s:"ye",a:"예"},
{c:"ㅘ",s:"wa",a:"와"},
{c:"ㅙ",s:"wae",a:"왜"},
{c:"ㅚ",s:"oe / we",a:"외"},
{c:"ㅝ",s:"wo",a:"워"},
{c:"ㅞ",s:"we",a:"웨"},
{c:"ㅟ",s:"wi",a:"위"},
{c:"ㅢ",s:"ui",a:"의"}
];

const consonantBasic=[
{c:"ㄱ",s:"g/k",a:"가"},
{c:"ㄴ",s:"n",a:"나"},
{c:"ㄷ",s:"d/t",a:"다"},
{c:"ㄹ",s:"r/l",a:"라"},
{c:"ㅁ",s:"m",a:"마"},
{c:"ㅂ",s:"b/p",a:"바"},
{c:"ㅅ",s:"s",a:"사"},
{c:"ㅇ",s:"silencioso/ng",a:"아"},
{c:"ㅈ",s:"j",a:"자"},
{c:"ㅊ",s:"ch",a:"차"},
{c:"ㅋ",s:"k",a:"카"},
{c:"ㅌ",s:"t",a:"타"},
{c:"ㅍ",s:"p",a:"파"},
{c:"ㅎ",s:"h",a:"하"}
];

const consonantDouble=[
{c:"ㄲ",s:"kk",a:"까"},
{c:"ㄸ",s:"tt",a:"따"},
{c:"ㅃ",s:"pp",a:"빠"},
{c:"ㅆ",s:"ss",a:"싸"},
{c:"ㅉ",s:"jj",a:"짜"}
];

const batchim=[
{c:"ㄱ",s:"k",a:"국"},
{c:"ㄴ",s:"n",a:"산"},
{c:"ㄷ",s:"t",a:"옷"},
{c:"ㄹ",s:"l",a:"달"},
{c:"ㅁ",s:"m",a:"밤"},
{c:"ㅂ",s:"p",a:"밥"},
{c:"ㅇ",s:"ng",a:"강"}
];

const doubleBatchim=[
{c:"ㄳ",s:"ks",a:"넋"},
{c:"ㄵ",s:"nj",a:"앉다"},
{c:"ㄶ",s:"nh",a:"많다"},
{c:"ㄺ",s:"lk",a:"읽다"},
{c:"ㄻ",s:"lm",a:"삶"},
{c:"ㄼ",s:"lp",a:"짧다"},
{c:"ㄽ",s:"ls",a:"곬"},
{c:"ㄾ",s:"lt",a:"핥다"},
{c:"ㄿ",s:"lp",a:"읊다"},
{c:"ㅀ",s:"lh",a:"싫다"},
{c:"ㅄ",s:"ps",a:"없다"}
];

let xp=Number(localStorage.getItem("xp")||0);
let completed=JSON.parse(localStorage.getItem("completed")||"[]");
if(!Array.isArray(completed))completed=[];

let hangulCategory="vowels";
let quizMode="meaning";
let currentQuestion=null;
let answered=false;

const content=document.getElementById("content");

function stats(){
 document.getElementById("xp").textContent=xp;
 document.getElementById("done").textContent=completed.length+"/30";
 document.getElementById("level").textContent=Math.floor(xp/100)+1;
}

function speak(text){
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){
  alert("A leitura em voz alta não é compatível com este navegador.");
  return;
 }
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="ko-KR";
 u.rate=.82;
 const voices=window.speechSynthesis.getVoices();
 const koreanVoice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));
 if(koreanVoice)u.voice=koreanVoice;
 u.onerror=()=>{};
 window.speechSynthesis.speak(u);
}

function addXP(amount){
 xp+=amount;
 localStorage.setItem("xp",String(xp));
 stats();
}

function render(tab="inicio"){
 document.querySelectorAll("nav button").forEach(b=>{
  b.classList.toggle("active",b.dataset.tab===tab);
 });

 if(tab==="inicio"){
  const percent=Math.round(completed.length/30*100);
  content.innerHTML=`
  <div class="panel">
   <div class="section-head"><h2>Seu progresso</h2><b>${percent}%</b></div>
   <p class="muted">Continue aprendendo no seu ritmo.</p>
   <div class="progress"><i style="width:${percent}%"></i></div>
  </div>
  <h2>Comece por aqui</h2>
  <div class="grid">
   <button class="tile" onclick="render('hangul')"><span class="emoji">🔤</span><b>Aprender Hangul</b><small>Vogais, consoantes e 받침</small></button>
   <button class="tile" onclick="render('vocabulario')"><span class="emoji">💬</span><b>Palavras úteis</b><small>Vocabulário com áudio</small></button>
   <button class="tile" onclick="render('licoes')"><span class="emoji">📖</span><b>30 lições</b><small>Aprenda passo a passo</small></button>
   <button class="tile" onclick="startQuiz('listening')"><span class="emoji">🎧</span><b>Quiz de escuta</b><small>Treine seus ouvidos</small></button>
   <button class="tile" onclick="render('quiz')"><span class="emoji">🧠</span><b>Praticar</b><small>Teste o que aprendeu</small></button>
  </div>
  <div class="notice">💡 Dica: toque no botão 🔊 para ouvir a pronúncia coreana. A voz disponível depende do seu dispositivo e navegador.</div>`;
 }

 if(tab==="hangul")renderHangul();

 if(tab==="vocabulario"){
  content.innerHTML=`
  <div class="panel">
   <h2>Vocabulário essencial</h2>
   <p class="muted">Toque em “Ouvir” para escutar a palavra em coreano.</p>
   ${vocab.map(w=>`
    <div class="lesson section-head">
     <div><div class="korean">${w[0]}</div><p>${w[1]}</p></div>
     <button class="primary" onclick="speak('${w[0]}')">🔊 Ouvir</button>
    </div>`).join("")}
  </div>`;
 }

 if(tab==="licoes"){
  content.innerHTML=`
  <div class="panel">
   <h2>30 lições para iniciantes</h2>
   <p class="muted">Conclua uma lição para ganhar 10 XP.</p>
   ${lessons.map((l,i)=>`
    <div class="lesson section-head">
     <div>
      <h3>${completed.includes(i)?"✅":"📘"} ${i+1}. ${l[0]}</h3>
      <div class="korean">${l[1]}</div>
      <p>${l[2]}</p>
     </div>
     <div>
      <button class="secondary" onclick="speak('${l[1].replaceAll("'","\\'")}')">🔊</button>
      <button class="primary" onclick="complete(${i})">${completed.includes(i)?"Rever":"Estudar"}</button>
     </div>
    </div>`).join("")}
  </div>`;
 }

 if(tab==="quiz")startQuiz("meaning");
}

function renderHangul(){
 const categories=[
  {id:"vowels",label:"Vogais básicas"},
  {id:"compoundVowels",label:"Vogais compostas"},
  {id:"consonants",label:"Consoantes"},
  {id:"doubleConsonants",label:"Consoantes duplas"},
  {id:"batchim",label:"받침 (batchim)"},
  {id:"doubleBatchim",label:"받침 duplo"}
 ];

 const data={
  vowels:vowelBasic,
  compoundVowels:vowelCompound,
  consonants:consonantBasic,
  doubleConsonants:consonantDouble,
  batchim:batchim,
  doubleBatchim:doubleBatchim
 }[hangulCategory];

 const intro={
  vowels:"As 10 vogais básicas. O ㅇ é usado aqui como apoio para formar uma sílaba e ouvir o som.",
  compoundVowels:"As 11 vogais compostas. Algumas pronúncias podem soar muito parecidas no coreano atual.",
  consonants:"As 14 consoantes básicas. O som pode mudar conforme a posição na sílaba.",
  doubleConsonants:"As 5 consoantes tensas (fortes). Ouça os exemplos para perceber a diferença.",
  batchim:"Batchim é a consoante final de uma sílaba. Estas são as 7 pronúncias finais principais.",
  doubleBatchim:"Os 11 batchim compostos. A pronúncia pode variar quando a palavra é ligada à sílaba seguinte."
 }[hangulCategory];

 content.innerHTML=`
 <div class="panel">
  <h2>Hangul — 한글</h2>
  <p class="muted">Aprenda o alfabeto coreano por partes e escute cada exemplo.</p>
  <div class="subnav">
   ${categories.map(c=>`
    <button class="${c.id===hangulCategory?"active":""}" onclick="setHangulCategory('${c.id}')">${c.label}</button>
   `).join("")}
  </div>
  <div class="notice">${intro}</div>
  <div class="char-grid">
   ${data.map(item=>`
    <div class="char-card">
     <div class="letter">${item.c}</div>
     <div class="sound">${item.s}</div>
     <button onclick="speak('${item.a}')">🔊 ${item.a}</button>
    </div>
   `).join("")}
  </div>
  ${hangulCategory==="vowels"?'<div class="notice">Dica: para ouvir uma vogal isolada, usamos ㅇ antes dela: 아, 야, 어, 여… O ㅇ não tem som no início da sílaba.</div>':""}
  ${hangulCategory==="consonants"?'<div class="notice">A escrita “g/k”, “d/t” etc. é apenas uma aproximação para falantes de português, não uma equivalência perfeita.</div>':""}
  ${hangulCategory==="compoundVowels"?'<div class="notice">ㅢ pode ser pronunciado de maneiras diferentes conforme a posição e a palavra. ㅐ e ㅔ também podem soar iguais para muitos falantes.</div>':""}
 </div>`;
}

function setHangulCategory(id){
 hangulCategory=id;
 renderHangul();
}

function complete(index){
 if(!completed.includes(index)){
  completed.push(index);
  localStorage.setItem("completed",JSON.stringify(completed));
  addXP(10);
 }
 render("licoes");
}

function startQuiz(mode){
 quizMode=mode;
 answered=false;
 const pool=vocab;
 const item=pool[Math.floor(Math.random()*pool.length)];
 const distractors=pool.filter(w=>w[1]!==item[1]).sort(()=>Math.random()-.5).slice(0,3);
 const opts=[item,...distractors].sort(()=>Math.random()-.5);
 currentQuestion={item,opts};
 renderQuiz();
}

function renderQuiz(){
 if(!currentQuestion)return;

 const q=currentQuestion.item;

 const prompt=quizMode==="listening"
 ?`<div class="quiz-prompt">
   <div class="tiny">OUÇA E ESCOLHA O SIGNIFICADO</div>
   <div class="korean">🔊</div>
   <button class="primary" onclick="speak('${q[0]}')">▶ Ouvir novamente</button>
  </div>`
 :`<div class="quiz-prompt">
   <div class="tiny">O QUE SIGNIFICA ESTA PALAVRA?</div>
   <div class="korean">${q[0]}</div>
   <button class="secondary" onclick="speak('${q[0]}')">🔊 Ouvir</button>
  </div>`;

 content.innerHTML=`
 <div class="panel">
  <h2>🧠 Quiz rápido</h2>
  <div class="subnav">
   <button class="${quizMode==="meaning"?"active":""}" onclick="startQuiz('meaning')">Significado</button>
   <button class="${quizMode==="listening"?"active":""}" onclick="startQuiz('listening')">🎧 Escuta</button>
  </div>
  <p class="muted">${quizMode==="listening"?"Escute a palavra coreana e escolha a tradução.":"Escolha a tradução correta da palavra coreana."}</p>
  ${prompt}
  <div id="quizOptions">
   ${currentQuestion.opts.map((o,i)=>`
    <button class="answer" onclick="answerQuiz(this,${i})">${o[1]}</button>
   `).join("")}
  </div>
  <p id="feedback" class="muted" aria-live="polite"></p>
  <button class="primary" id="nextQuestion" style="display:none" onclick="startQuiz(quizMode)">Próxima pergunta →</button>
  <p class="tiny">Resposta correta: +5 XP. Cada pergunta conta apenas uma vez.</p>
 </div>`;

 if(quizMode==="listening"){
  setTimeout(()=>{
   if(currentQuestion&&!answered)speak(q[0]);
  },250);
 }
}

function answerQuiz(button,index){
 if(answered)return;
 answered=true;

 const correct=currentQuestion.item[1];
 const selected=currentQuestion.opts[index];
 const buttons=[...document.querySelectorAll("#quizOptions button")];

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(currentQuestion.opts[i][1]===correct)b.classList.add("correct");
 });

 const feedback=document.getElementById("feedback");

 if(selected[1]===correct){
  feedback.textContent="Muito bem! Resposta correta. +5 XP 🎉";
  addXP(5);
 }else{
  button.classList.add("wrong");
  feedback.textContent="Quase! A resposta correta é: "+correct;
 }

 document.getElementById("nextQuestion").style.display="inline-block";
}

function speakCurrent(){
 if(currentQuestion)speak(currentQuestion.item[0]);
}

document.querySelectorAll("nav button").forEach(button=>{
 button.addEventListener("click",()=>render(button.dataset.tab));
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
 });
}

if("speechSynthesis" in window)window.speechSynthesis.getVoices();

stats();
render();
</script>
</body>
</html>
