<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b55d9">
<meta name="description" content="Aprenda coreano de um jeito fácil e divertido.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Coreano Fácil</title>

<style>
:root{
 --ink:#24243b;--muted:#77778f;--purple:#625ce7;
 --lav:#efeeff;--line:#ececf4;--bg:#f7f7fc;
 --green:#159768;--red:#c94d62;--white:#fff;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
header{
 background:linear-gradient(135deg,#625ce7,#8b75ef);
 color:white;padding:25px 20px 34px;
 border-radius:0 0 28px 28px;
}
.wrap{max-width:820px;margin:auto}
header .top{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;font-weight:750;font-size:12px;
}
h1{font-size:29px;line-height:1.25;margin:24px 0 8px}
header p{margin:0;opacity:.9}
main{max-width:820px;margin:-12px auto 30px;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat,.panel,.tile{
 background:white;border:1px solid var(--line);
 border-radius:18px;padding:15px;
 box-shadow:0 5px 18px #29265b08;
}
.stat strong{display:block;font-size:21px}
.stat span{font-size:11px;color:var(--muted)}
nav{
 display:flex;gap:8px;overflow-x:auto;
 padding:18px 0 12px;scrollbar-width:none;
}
nav button,.subnav button{
 border:0;border-radius:999px;background:#eae9f8;
 color:#555276;padding:10px 15px;font-weight:700;
 white-space:nowrap;font-size:13px;
}
nav button.active,.subnav button.active{
 background:var(--purple);color:white;
}
.panel{padding:18px;margin:8px 0 14px}
.section-head{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
 padding:15px;text-align:left;cursor:pointer;color:inherit;width:100%;
 transition:transform .15s,border-color .15s;
}
.tile:active{transform:scale(.98)}
.tile .emoji{font-size:25px}
.tile b{display:block;margin:7px 0 3px}
.tile small{color:var(--muted);font-size:12px}
button{cursor:pointer;font:inherit}
.primary,.secondary{
 border-radius:12px;padding:10px 13px;font-weight:750;
}
.primary{background:var(--purple);color:white;border:0}
.secondary{
 background:var(--lav);color:var(--purple);
 border:1px solid #dedcff;
}
.ghost{
 background:white;color:var(--muted);
 border:1px solid var(--line);border-radius:10px;padding:9px 12px;
}
.lesson{
 border:1px solid var(--line);border-radius:14px;
 padding:14px;margin:9px 0;background:white;
}
.lesson p{margin:5px 0;color:var(--muted);font-size:13px}
.korean{font-size:27px;font-weight:850;letter-spacing:1px}
.answer{
 display:block;width:100%;text-align:left;
 border:1px solid var(--line);border-radius:12px;
 background:white;padding:13px;margin:8px 0;
}
.answer:hover{border-color:var(--purple);background:var(--lav)}
.feedback-area{
 text-align:center;padding:24px 16px;margin:20px 0;
 background:white;border:1px solid var(--line);border-radius:18px;
}
.feedback-link{
 display:inline-block;padding:14px 24px;background:#6d5ce7;
 color:white;border-radius:12px;text-decoration:none;font-weight:bold;
}
.feedback-area p{font-size:13px;color:var(--muted);margin-bottom:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}

/* COREANO FÁCIL - RESPONSIVE UI FIX */
.subnav{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:8px;
 margin:12px 0 16px;
 width:100%;
}
.subnav button{
 width:100%;
 min-width:0;
 min-height:44px;
 padding:10px 8px;
 white-space:normal;
 overflow-wrap:anywhere;
 line-height:1.35;
 text-align:center;
 font-size:12px;
}
.char-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
 gap:10px;
 width:100%;
 min-width:0;
}
.char-card{
 border:1px solid var(--line);
 background:#fff;
 border-radius:15px;
 padding:14px 5px;
 text-align:center;
 min-width:0;
 width:100%;
 overflow:hidden;
 box-sizing:border-box;
}
.char-card .letter{
 font-size:clamp(29px,5vw,36px);
 font-weight:850;
 line-height:1.4;
}
.char-card .sound{
 font-size:12px;
 color:var(--muted);
 min-height:22px;
 overflow-wrap:anywhere;
}
.char-card button{
 display:block;
 width:100%;
 max-width:100%;
 margin-top:8px;
 border:0;
 background:var(--lav);
 color:var(--purple);
 border-radius:9px;
 padding:8px 3px;
 font-weight:700;
 font-size:11px;
 white-space:normal;
 overflow-wrap:anywhere;
 box-sizing:border-box;
}
.panel{
 min-width:0;
 overflow:hidden;
}
.subnav,.char-grid,.char-card{
 box-sizing:border-box;
}
.tag{
 display:inline-block;font-size:11px;color:#625ce7;background:#efeeff;
 padding:4px 8px;border-radius:999px;font-weight:750;
}
.notice{
 padding:12px;border-radius:12px;background:#f5f4ff;
 color:#555276;font-size:13px;line-height:1.6;margin:12px 0;
}
.quiz-prompt{
 background:#f8f7ff;border:1px solid #e8e6ff;
 border-radius:16px;text-align:center;padding:22px 12px;margin:14px 0;
}
.quiz-prompt .korean{font-size:38px}
.correct{background:#e1f7ed!important;border-color:#8bd8b6!important}
.wrong{background:#ffe9ec!important;border-color:#f0aab5!important}
.tiny{font-size:12px;color:var(--muted)}
.progress{
 height:9px;background:#eeedf7;border-radius:9px;
 overflow:hidden;margin-top:10px;
}
.progress i{display:block;height:100%;background:#61c99c}
.word-row{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
}
.word-row:last-child{border-bottom:0}
.word-row .korean{font-size:22px}
.lesson-block{
 background:#faf9ff;border:1px solid #eeecff;
 border-radius:13px;padding:13px;margin:11px 0;
}
.lesson-block h3{font-size:14px;margin-bottom:9px}
.dialogue-line{
 padding:9px 11px;background:white;border-radius:10px;
 margin:6px 0;border:1px solid var(--line);
}
.dialogue-line b{color:var(--purple);font-size:12px}
.dialogue-line .korean{font-size:20px}
.setting-row{
 display:flex;justify-content:space-between;align-items:center;
 gap:12px;padding:10px 0;border-bottom:1px solid var(--line);
}
select{
 max-width:58%;padding:9px;border:1px solid var(--line);
 border-radius:10px;background:white;color:var(--ink);
}
input[type="range"]{width:100%;accent-color:var(--purple)}
.empty{text-align:center;padding:25px;color:var(--muted)}
button:focus-visible,a:focus-visible{
 outline:3px solid #bcb8ff;outline-offset:2px;
}

/* 모바일 */
@media(max-width:430px){
 .subnav{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
 }
 .char-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
 }
 .char-card{padding:12px 4px}
 .char-card button{font-size:10px}
}

/* 태블릿 및 PC */
@media(min-width:620px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
 <div class="wrap">
  <div class="top">
   <span>🇰🇷 COREANO FÁCIL</span>
   <span>🇧🇷 Para quem fala português</span>
  </div>

 </nav>

 <section id="content" aria-live="polite"></section>

 <div class="feedback-area">

  <p>Sua opinião é importante para nós!</p>
 </div>
</main>

<footer>Coreano Fácil · Feito com carinho para estudantes de coreano</footer>

function readNumber(key,oldKey){
 const a=localStorage.getItem(key);
 const b=oldKey?localStorage.getItem(oldKey):null;
 return Number(a!==null?a:(b!==null?b:0))||0;
}
function readArray(key,oldKey){
 try{
  const a=localStorage.getItem(key);
  const b=oldKey?localStorage.getItem(oldKey):null;
  const value=JSON.parse(a!==null?a:(b!==null?b:"[]"));
  return Array.isArray(value)?value:[];
 }catch(e){return [];}
}

function saveProgress(){
 localStorage.setItem("cf_xp",String(xp));
 localStorage.setItem("xp",String(xp));
 localStorage.setItem("cf_completed",JSON.stringify(completed));
 localStorage.setItem("completed",JSON.stringify(completed));
}
function stats(){
 document.getElementById("xp").textContent=xp;
 document.getElementById("done").textContent=completed.length+"/30";
 document.getElementById("level").textContent=Math.floor(xp/100)+1;
}
function addXP(amount){
 xp+=amount;
 saveProgress();
 stats();
}
function complete(index){
 if(!completed.includes(index)){
  completed.push(index);
  addXP(10);
  saveProgress();
 }
 render("licoes");
}

 voices=window.speechSynthesis.getVoices();
}

}
function koreanVoices(){
 return voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ko"));
}

  alert("Não encontramos uma voz coreana neste dispositivo.\n\nInstale ou ative uma voz em coreano (한국어 / Korean) nas configurações de voz do seu dispositivo ou navegador.\n\nO aplicativo não usará uma voz de outro idioma para evitar uma pronúncia incorreta.");
  return;
 }
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="ko-KR";
 u.rate=speechRate;
 u.pitch=1;
 const chosen=available.find(v=>v.name===selectedVoiceName)||available[0];
 u.voice=chosen;
 u.onerror=()=>{};
 window.speechSynthesis.speak(u);
}
function speakSlow(text){
 const old=speechRate;
 speechRate=.68;
 speak(text);
 speechRate=old;
}

function makeQuestion(mode){
 if(mode==="hangul"){
  const all=[...vowelBasic,...vowelCompound,...consonantBasic,...consonantDouble];
  const item=all[Math.floor(Math.random()*all.length)];
  const options=[item,...all.filter(x=>x.c!==item.c).sort(()=>Math.random()-.5).slice(0,3)];
  return {
   prompt:item.a,
   label:"QUAL É O SÍMBOLO CORRETO?",
   answer:item.c,
   options:options.sort(()=>Math.random()-.5).map(x=>x.c),
   speech:item.a
  };
 }
 if(mode==="lesson"){
  const lesson=lessons[Math.floor(Math.random()*lessons.length)];
  const word=lesson.words[Math.floor(Math.random()*lesson.words.length)];
  const wrong=vocab.filter(x=>x[1]!==word[1]).sort(()=>Math.random()-.5).slice(0,3);
  const options=[word,...wrong].sort(()=>Math.random()-.5);
  return {
   prompt:word[0],
   label:"REVISÃO DAS LIÇÕES",
   answer:word[1],
   options:options.map(x=>x[1]),
   speech:word[0]
  };
 }
 const item=vocab[Math.floor(Math.random()*vocab.length)];
 const wrong=vocab.filter(x=>x[1]!==item[1]).sort(()=>Math.random()-.5).slice(0,3);
 const options=[item,...wrong].sort(()=>Math.random()-.5);
 return {
  prompt:mode==="listening"?"🔊":" "+item[0],
  label:mode==="listening"?"OUÇA E ESCOLHA O SIGNIFICADO":"O QUE SIGNIFICA ESTA PALAVRA?",
  answer:item[1],
  options:options.map(x=>x[1]),
  speech:item[0]
 };
}

function startQuiz(mode){
 quizMode=mode;
 answered=false;
 currentQuestion=makeQuestion(mode);
 renderQuiz();
}
function renderQuiz(){
 if(!currentQuestion)return;
 const q=currentQuestion;
 content.innerHTML=`
 <div class="panel">
  <button class="ghost" onclick="render('quiz')">← Exercícios</button>
  <h2 style="margin-top:15px">🧠 Quiz rápido</h2>
  <div class="subnav">
   <button class="${quizMode==="meaning"?"active":""}" onclick="startQuiz('meaning')">Significado</button>
   <button class="${quizMode==="listening"?"active":""}" onclick="startQuiz('listening')">🎧 Escuta</button>
   <button class="${quizMode==="hangul"?"active":""}" onclick="startQuiz('hangul')">Hangul</button>
   <button class="${quizMode==="lesson"?"active":""}" onclick="startQuiz('lesson')">Lições</button>
  </div>
  <div class="quiz-prompt">
   <div class="tiny">${q.label}</div>
   <div class="korean">${q.prompt}</div>
   ${quizMode==="listening"?
    '<button class="primary" onclick="speak(currentQuestion.speech)">▶ Ouvir novamente</button>':
    '<button class="secondary" onclick="speak(currentQuestion.speech)">🔊 Ouvir</button>'}
  </div>
  <div id="quizOptions">
   ${q.options.map((o,i)=>`
    <button class="answer" onclick="answerQuiz(this,${i})">${o}</button>
   `).join("")}
  </div>
  <p id="feedback" class="muted" aria-live="polite"></p>
  <button class="primary" id="nextQuestion" style="display:none;width:100%" onclick="startQuiz(quizMode)">Próxima pergunta →</button>
  <p class="tiny">Resposta correta: +5 XP.</p>
 </div>`;
 if(quizMode==="listening"){
  setTimeout(()=>{
   if(currentQuestion===q&&!answered)speak(q.speech);
  },350);
 }
}
function answerQuiz(button,index){
 if(answered)return;
 answered=true;
 const q=currentQuestion;
 const selected=q.options[index];
 const buttons=[...document.querySelectorAll("#quizOptions button")];
 buttons.forEach(b=>{
  b.disabled=true;
  if(b.textContent.trim()===q.answer)b.classList.add("correct");
 });
 const feedback=document.getElementById("feedback");
 if(selected===q.answer){
  feedback.textContent="Muito bem! Resposta correta. +5 XP 🎉";
  addXP(5);
  quizStreak++;
 }else{
  button.classList.add("wrong");
  feedback.textContent="Quase! A resposta correta é: "+q.answer;
  quizStreak=0;
 }
 document.getElementById("nextQuestion").style.display="block";
}

    'ㅅ':'t','ㅆ':'t','ㅇ':'ng',
    'ㅈ':'t','ㅊ':'t','ㅋ':'k',
    'ㅌ':'t','ㅍ':'p','ㅎ':'t'
  };

  const clusters = {
    'ㄳ':['ㄱ','ㅅ'],
    'ㄵ':['ㄴ','ㅈ'],
    'ㄶ':['ㄴ','ㅎ'],
    'ㄺ':['ㄹ','ㄱ'],
    'ㄻ':['ㄹ','ㅁ'],
    'ㄼ':['ㄹ','ㅂ'],
    'ㄽ':['ㄹ','ㅅ'],
    'ㄾ':['ㄹ','ㅌ'],
    'ㄿ':['ㄹ','ㅍ'],
    'ㅀ':['ㄹ','ㅎ'],
    'ㅄ':['ㅂ','ㅅ']
  };

  function decompose(ch) {
    const n = ch.charCodeAt(0) - 0xAC00;

    if (n < 0 || n > 11171) return null;

    return {
      onset: onsetList[Math.floor(n / 588)],
      vowel: vowelList[Math.floor((n % 588) / 28)],
      coda: codaList[n % 28]
    };
  }

  function romanizeHangul(input) {
    const chars = Array.from(String(input));
    const parts = chars.map(decompose);

    for (let i = 0; i < parts.length - 1; i++) {
      const a = parts[i];
      const b = parts[i + 1];

      if (!a || !b || !a.coda) continue;

      // 연음: 받침 뒤에 모음이 오는 경우
      if (b.onset === 'ㅇ') {
        if (a.coda === 'ㅎ') {
          a.coda = '';
        } else if (clusters[a.coda]) {
          const pair = clusters[a.coda];

          a.coda = pair[0];

          if (pair[1] !== 'ㅎ') {
            b.onset = pair[1];
          }
        } else {
          b.onset = a.coda;
          a.coda = '';
        }

        // ㄷ/ㅌ + 이의 구개음화
        if (
          b.vowel === 'ㅣ' &&
          (b.onset === 'ㄷ' || b.onset === 'ㅌ')
        ) {
          b.onset = b.onset === 'ㄷ' ? 'ㅈ' : 'ㅊ';
        }

        continue;
      }

      // ㅎ 관련 거센소리 변화
      if (
        a.coda === 'ㅎ' ||
        a.coda === 'ㄶ' ||
        a.coda === 'ㅀ'
      ) {
        const retained =
          a.coda === 'ㄶ' ? 'ㄴ' :
          a.coda === 'ㅀ' ? 'ㄹ' : '';

        if (['ㄱ','ㄷ','ㅈ'].includes(b.onset)) {
          b.onset = {
            'ㄱ':'ㅋ',
            'ㄷ':'ㅌ',
            'ㅈ':'ㅊ'
          }[b.onset];

          a.coda = retained;
          continue;
        }

        if (b.onset === 'ㅅ') {
          b.onset = 'ㅆ';
          a.coda = retained;
          continue;
        }

        if (b.onset === 'ㄴ' || b.onset === 'ㅁ') {
          a.coda = retained || 'ㄴ';
        }
      }

      // 구개음화
      if (
        b.vowel === 'ㅣ' &&
        (a.coda === 'ㄷ' || a.coda === 'ㅌ')
      ) {
        b.onset = a.coda === 'ㄷ' ? 'ㅈ' : 'ㅊ';
        a.coda = '';
        continue;
      }

      // 비음화
      if (b.onset === 'ㄴ' || b.onset === 'ㅁ') {
        if (['ㄱ','ㄲ','ㅋ','ㄳ','ㄺ'].includes(a.coda)) {
          a.coda = 'ㅇ';
        } else if (
          ['ㄷ','ㅅ','ㅆ','ㅈ','ㅊ','ㅌ','ㅎ'].includes(a.coda)
        ) {
          a.coda = 'ㄴ';
        } else if (
          ['ㅂ','ㅍ','ㄿ','ㅄ'].includes(a.coda)
        ) {
          a.coda = 'ㅁ';
        }
      }

      // 유음화
      if (b.onset === 'ㄹ' && a.coda === 'ㄴ') {
        a.coda = 'ㄹ';
      }

      if (b.onset === 'ㄴ' && a.coda === 'ㄹ') {
        b.onset = 'ㄹ';
      }

      // 장애음 + ㄹ의 비음화
      if (
        b.onset === 'ㄹ' &&
        ['ㄱ','ㄲ','ㅋ','ㄳ','ㄺ'].includes(a.coda)
      ) {
        a.coda = 'ㅇ';
        b.onset = 'ㄴ';
      } else if (
        b.onset === 'ㄹ' &&
        ['ㅂ','ㅍ','ㄿ','ㅄ'].includes(a.coda)
      ) {
        a.coda = 'ㅁ';
        b.onset = 'ㄴ';
      } else if (
        b.onset === 'ㄹ' &&
        ['ㄷ','ㅅ','ㅆ','ㅈ','ㅊ','ㅌ','ㅎ'].includes(a.coda)
      ) {
        a.coda = 'ㄴ';
        b.onset = 'ㄴ';
      }
    }

    return parts.map((p, i) => {
      if (!p) return chars[i];

      let onset = onsetRoman[p.onset] || '';

      if (
        p.onset === 'ㄹ' &&
        i > 0 &&
        parts[i - 1] &&
        parts[i - 1].coda === 'ㄹ'
      ) {
        onset = 'l';
      }

      return (
        onset +
        (vowelRoman[p.vowel] || '') +
        (p.coda ? (codaRoman[p.coda] || '') : '')
      );
    }).join('');
  }

  const root = document.getElementById('content');
  if (!root) return;

  const style = document.createElement('style');

  style.textContent = `
    .romanization {
      display: block;
      margin-top: 4px;
      color: #85839a;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  `;

  document.head.appendChild(style);

  function updateContent() {
    const walker = document.createTreeWalker(
      root,
      NodeFilter.SHOW_TEXT
    );

    const nodes = [];
    let node;

    while ((node = walker.nextNode())) {
      nodes.push(node);
    }

    nodes.forEach(textNode => {
      const updated = textNode.nodeValue
        .replace(/Quiz de escuta/gi, 'Quiz: Ouvir')
        .replace(/\bEscuta\b/gi, 'Ouvir');

      if (updated !== textNode.nodeValue) {
        textNode.nodeValue = updated;
      }
    });

    root.querySelectorAll('.korean').forEach(element => {
      if (element.dataset.romanizationAdded === 'true') return;

      const original = Array.from(element.childNodes)
        .filter(child => child.nodeType === Node.TEXT_NODE)
        .map(child => child.nodeValue)
        .join(' ')
        .trim();

      if (!/[가-힣]/.test(original)) return;

      const span = document.createElement('span');

      span.className = 'romanization';
      span.lang = 'pt-BR';
      span.textContent = romanizeHangul(original);

      element.appendChild(span);
      element.dataset.romanizationAdded = 'true';
    });
  }

  const observer = new MutationObserver(updateContent);

  observer.observe(root, {
    childList: true,
    subtree: true
  });

  updateContent();

  console.log('Coreano Fácil: romanização atualizada.');
})();
</script>
