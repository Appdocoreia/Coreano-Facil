
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6558d9">
<title>Coreano Fácil</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f7fb;color:#24243a;padding:24px;line-height:1.6}
.box{max-width:600px;margin:40px auto;background:white;padding:25px;border-radius:18px}
button{border:0;border-radius:10px;background:#6558d9;color:white;padding:12px 18px;font-weight:bold;cursor:pointer}
.error{color:#c84c62}
</style>
</head>
<body>
<div class="box">
<h2>Coreano Fácil</h2>
<p id="status">Carregando seu aplicativo...</p>
</div>
<script>
(async function(){
const status=document.getElementById("status");
const sourceURL="https://raw.githubusercontent.com/Appdocoreia/Coreano-Facil/main/index.html";

try{
 const response=await fetch(sourceURL+"?v="+Date.now(),{cache:"no-store"});
 if(!response.ok)throw new Error("Não foi possível carregar o aplicativo.");
 let html=await response.text();

 const oldDialogue='const dialogue=l.dialogue.split("|").map((line,j)=>`<div><b>${j%2===0?"A":"B"}:</b> ${line}</div>`).join("");';

 const newDialogue=`const dialogueLines=l.dialogue.split("|").map(line=>line.trim()).filter(Boolean);
  const escapeAttr=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const dialogue=dialogueLines.map((line,j)=>\`<div class="dialogue-line"><div class="dialogue-text"><b>\${j%2===0?"A":"B"}:</b> \${line}</div><button class="speak" onclick="speak('\${escapeAttr(line)}')">🔊 Ouvir</button></div>\`).join("");
  const fullDialogue=dialogueLines.join(" ");`;

 if(!html.includes(oldDialogue))throw new Error("A versão original mudou. Atualização interrompida para proteger o aplicativo.");

 html=html.replace(oldDialogue,newDialogue);

 const oldSection='<section class="panel"><h3>🗣️ Diálogo prático</h3><div class="dialogue">${dialogue}</div>\\n  <p class="quiz-sub">Leia o diálogo em voz alta. Toque nas frases de vocabulário para praticar a pronúncia.</p></section>';

 const newSection=`<section class="panel"><h3>🗣️ Diálogo prático</h3>
  <button class="btn soft" style="margin-bottom:14px" onclick="speak(fullDialogue)">▶ Ouvir diálogo completo</button>
  <div class="dialogue">\${dialogue}</div>
  <p class="quiz-sub">Toque em 🔊 para ouvir cada frase ou escute o diálogo completo.</p></section>`;

 if(!html.includes(oldSection))throw new Error("Não foi possível localizar a seção de diálogo. Nenhuma alteração foi aplicada.");

 html=html.replace(oldSection,newSection);

 const css=`
.dialogue-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.dialogue-line:last-child{border-bottom:0}
.dialogue-text{flex:1;min-width:0;overflow-wrap:anywhere}
.dialogue-line .speak{flex-shrink:0}
@media(max-width:430px){.dialogue-line{align-items:flex-start}}
`;

 html=html.replace("</style>",css+"</style>");
 document.open();
 document.write(html);
 document.close();

}catch(error){
 status.className="error";
 status.textContent="Erro: "+error.message+" Atualize a página ou verifique a conexão.";
}
})();
</script>
</body>
</html>
