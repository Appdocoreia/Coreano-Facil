
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#625ce7"><meta name="description" content="Aprenda coreano de um jeito fácil e divertido.">
<title>Coreano Fácil</title>
<style>
:root{--ink:#24243b;--muted:#77778f;--purple:#625ce7;--lav:#efeeff;--line:#ececf4;--bg:#f7f7fc;--white:#fff;--green:#198754}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(135deg,#625ce7,#8d79ef);color:white;padding:26px 18px 24px;border-radius:0 0 24px 24px}header h1{font-size:22px;margin:0 0 8px}header p{margin:5px 0;opacity:.95}.wrap{max-width:760px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-3px}.stat,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}.stat{text-align:center}.stat strong{display:block;font-size:21px;color:var(--purple)}.stat span{font-size:11px;color:var(--muted)}nav{display:flex;gap:7px;overflow:auto;padding:15px 0}nav button,.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--lav);color:var(--purple);font-weight:700;white-space:nowrap}nav button.active,.btn.primary{background:var(--purple);color:white}.card{margin:10px 0}.muted{color:var(--muted)}.progress{height:10px;background:#eee;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--purple);width:0}.lesson{display:flex;align-items:center;justify-content:space-between;gap:12px}.lesson h3{margin:0 0 4px;font-size:16px}.lesson p{margin:0}.tag{font-size:11px;background:var(--lav);color:var(--purple);padding:5px 8px;border-radius:20px}.word{font-size:30px;font-weight:800;margin:10px 0}.pron{color:var(--purple);font-weight:700}.answer{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink)}.answer:focus,.answer:hover{border-color:var(--purple);background:var(--lav)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.small{font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}.notice{background:#f0fff6;border:1px solid #c8eed7;padding:12px;border-radius:12px;color:#17683d}.hide{display:none}a{color:var(--purple)}
</style></head>
<body>
<header><div class="wrap"><h1>🇰🇷 COREANO FÁCIL</h1><p>🇧🇷 Para quem fala português</p><h2>안녕하세요! Vamos aprender coreano?</h2><p>Pequenos passos todos os dias. 💜</p></div></header>
<main class="wrap"><section class="stats"><div class="stat"><strong id="xp">0</strong><span>XP acumulado</span></div><div class="stat"><strong id="done">0/50</strong><span>Lições concluídas</span></div><div class="stat"><strong id="level">1</strong><span>Seu nível</span></div></section>
<nav id="nav"><button class="active" data-tab="inicio">Início</button><button data-tab="hangul">Hangul</button><button data-tab="vocabulario">Vocabulário</button><button data-tab="licoes">Lições</button><button data-tab="quiz">Quiz</button></nav>
<section id="content"></section>
<section class="card"><h3>💜 Ajude a melhorar o Coreano Fácil</h3><p class="small muted">Conte o que você achou do aplicativo. Sua opinião é muito importante!</p><a href="https://docs.google.com/forms/d/e/1FAIpQLSfM4YlJV9QZAVRQ1kqn2OSLUUZwna47-JadYb-3S9EKQmwIHA/viewform" target="_blank" rel="noopener">Responder à pesquisa</a></section>
</main>
<script>
const lessons=[
['Cumprimentos','안녕하세요','an-nyeong-ha-se-yo','Olá / Oi','É a forma educada e mais comum de cumprimentar alguém.','안녕하세요? 저는 마리아예요.','Olá! Eu sou Maria.'],
['Apresentações','저는 마리아예요','jeo-neun ma-ri-a-ye-yo','Eu sou Maria','저는 significa “eu” como tópico; 예요 é uma forma educada de “ser”.','저는 브라질 사람이에요.','Sou brasileira / brasileiro.'],
['Obrigado','감사합니다','gam-sa-ham-ni-da','Obrigado(a)','Expressão educada e muito usada para agradecer.','도와주셔서 감사합니다.','Obrigado por ajudar.'],
['Desculpas','죄송합니다','joe-song-ham-ni-da','Desculpe','Forma educada de pedir desculpas.','늦어서 죄송합니다.','Desculpe pelo atraso.'],
['Sim e não','네 / 아니요','ne / a-ni-yo','Sim / Não','네 significa sim; 아니요 significa não.','네, 좋아요.','Sim, está bom.'],
['Família','가족','ga-jok','Família','가족 é a palavra geral para família.','우리 가족이에요.','É minha família.'],
['Números nativos','하나, 둘, 셋','ha-na, dul, set','Um, dois, três','Números nativos são usados, por exemplo, para contar objetos e idade em certos contextos.','사과 두 개 주세요.','Duas maçãs, por favor.'],
['Números sino-coreanos','일, 이, 삼','il, i, sam','Um, dois, três','Sistema de números de origem chinesa, usado em datas, dinheiro e números de telefone.','삼 번이에요.','É o número três.'],
['Comida','밥','bap','Arroz / refeição','밥 pode significar arroz cozido ou refeição.','밥 먹었어요?','Você já comeu?'],
['Água','물 주세요','mul ju-se-yo','Água, por favor','주세요 é uma forma educada de pedir algo: “por favor, me dê”.','물 주세요.','Água, por favor.'],
['Café','커피','keo-pi','Café','Palavra emprestada; 커피 significa café.','커피 한 잔 주세요.','Um café, por favor.'],
['Restaurante','맛있어요','ma-si-sseo-yo','Está delicioso','Forma educada para dizer que algo está gostoso.','정말 맛있어요!','Está realmente delicioso!'],
['Hoje','오늘','o-neul','Hoje','오늘 significa hoje.','오늘 바빠요.','Estou ocupado(a) hoje.'],
['Dias da semana','월요일','wo-ryo-il','Segunda-feira','요일 significa dia da semana. 월요일 é segunda-feira.','오늘은 월요일이에요.','Hoje é segunda-feira.'],
['Lugares','학교','hak-kkyo','Escola','학교 é escola.','학교에 가요.','Vou à escola.'],
['Transporte','버스','beo-seu','Ônibus','버스 é ônibus.','버스를 타요.','Pego o ônibus.'],
['Compras','얼마예요?','eol-ma-ye-yo','Quanto custa?','Pergunta útil para saber o preço de algo.','이거 얼마예요?','Quanto custa isto?'],
['Cores','빨간색','ppal-gan-saek','Vermelho','색 significa cor; 빨간색 é a cor vermelha.','빨간색을 좋아해요.','Gosto de vermelho.'],
['Adjetivos','좋아요','jo-a-yo','É bom / Gosto','좋아요 pode significar “é bom” ou “gosto”, conforme o contexto.','한국 음식이 좋아요.','Gosto de comida coreana.'],
['Verbos','가요','ga-yo','Vou / Vai','Forma educada presente do verbo 가다 (ir).','집에 가요.','Vou para casa.'],
['Casa','집','jip','Casa','집 significa casa ou lar.','집에 있어요.','Estou em casa.'],
['Trabalho','일','il','Trabalho','일 pode significar trabalho ou tarefa.','오늘 일이 많아요.','Tenho muito trabalho hoje.'],
['Estudos','공부해요','gong-bu-hae-yo','Estudo','Forma educada do verbo 공부하다 (estudar).','한국어를 공부해요.','Estudo coreano.'],
['Hobbies','음악','eum-ak','Música','음악 significa música.','음악을 들어요.','Escuto música.'],
['Clima','날씨','nal-ssi','Clima / tempo','날씨 é usado para falar do clima.','날씨가 좋아요.','O tempo está bom.'],
['Sentimentos','행복해요','haeng-bok-hae-yo','Estou feliz','행복하다 significa ser/estar feliz.','오늘 행복해요.','Estou feliz hoje.'],
['Localização','어디예요?','eo-di-ye-yo','Onde fica?','어디 pergunta “onde”.','화장실이 어디예요?','Onde fica o banheiro?'],
['Pedido','도와주세요','do-wa-ju-se-yo','Ajude-me, por favor','Expressão educada para pedir ajuda.','도와주세요!','Ajude-me, por favor!'],
['Passado','갔어요','ga-sseo-yo','Fui / Foi','Forma passada e educada do verbo 가다 (ir).','어제 학교에 갔어요.','Ontem fui à escola.'],
['Revisão','한국어를 공부해요','han-gu-geo-reul gong-bu-hae-yo','Estudo coreano','Revise vocabulário e estruturas das lições anteriores.','매일 한국어를 공부해요.','Estudo coreano todos os dias.'],
['Introdução ao Hangul','한글','han-geul','Alfabeto coreano','O Hangul é o sistema de escrita coreano. As letras são agrupadas em blocos silábicos.','한글을 배워요.','Aprendo o Hangul.'],
['Vogais básicas','ㅏ ㅓ ㅗ ㅜ','a / eo / o / u','Vogais básicas','ㅏ soa como “a”; ㅓ é romanizado “eo” e não tem equivalente exato em português; ㅗ é “o”; ㅜ é “u”.','아, 어, 오, 우','Leia cada vogal em voz alta.'],
['Outras vogais','ㅡ ㅣ ㅐ ㅔ','eu / i / ae / e','Vogais','ㅡ não tem equivalente exato em português. ㅐ e ㅔ frequentemente têm pronúncia muito parecida no coreano atual.','으, 이, 애, 에','Pratique os sons com calma.'],
['Consoantes básicas 1','ㄱ ㄴ ㄷ ㄹ','g/k, n, d/t, r/l','Consoantes','A pronúncia de ㄱ, ㄷ varia conforme a posição. ㄹ pode soar entre r e l.','가, 나, 다, 라','Leia os blocos formados com ㅏ.'],
['Consoantes básicas 2','ㅁ ㅂ ㅅ ㅇ','m, b/p, s, som zero/ng','Consoantes','ㅇ não tem som no início da sílaba e soa “ng” no final.','마, 바, 사, 아','Observe a posição de ㅇ.'],
['Consoantes aspiradas','ㅋ ㅌ ㅍ ㅊ','k, t, p, ch aspirados','Consoantes fortes','Essas consoantes são pronunciadas com uma saída de ar mais forte.','카, 타, 파, 차','Coloque a mão perto da boca para sentir o ar.'],
['Consoantes duplas','ㄲ ㄸ ㅃ ㅆ ㅉ','kk, tt, pp, ss, jj','Consoantes tensas','São sons tensos, produzidos com maior firmeza, não simplesmente com mais ar.','까, 따, 빠, 싸, 짜','Pratique sem acrescentar uma vogal extra.'],
['Formando sílabas','가 나 다 한','ga, na, da, han','Blocos silábicos','As letras se combinam em blocos. Uma sílaba pode ter consoante inicial, vogal e consoante final.','한 + 국 = 한국','한국 significa Coreia.'],
['Lendo palavras','학교, 친구, 사람','hak-kkyo, chin-gu, sa-ram','Palavras simples','Leia cada bloco da esquerda para a direita e de cima para baixo.','친구가 와요.','Meu amigo / minha amiga vem.'],
['Pronúncia e 받침','한국, 밥, 집','han-guk, bap, jip','Consoante final','받침 é a consoante final de um bloco. Sua pronúncia pode mudar ao encontrar a sílaba seguinte.','한국어','Língua coreana.'],
['Cumprimentos em contexto','안녕하세요','an-nyeong-ha-se-yo','Olá','안녕하세요 é a saudação padrão. É adequada em muitas situações formais e informais educadas.','안녕하세요. 만나서 반가워요.','Olá. Prazer em conhecer você.'],
['Agradecer e responder','고마워요','go-ma-wo-yo','Obrigado(a)','고마워요 é educado e um pouco mais casual que 감사합니다. 아니에요 pode responder a um agradecimento.','고마워요! / 아니에요.','Obrigado! / Imagina.'],
['Pedir desculpas','미안해요','mi-an-hae-yo','Desculpe','미안해요 é educado, mas mais casual que 죄송합니다.','정말 미안해요.','Sinto muito mesmo.'],
['Perguntar e responder','네, 아니요','ne, a-ni-yo','Sim e não','네 e 아니요 são respostas comuns. O contexto e a entonação ajudam a comunicar cortesia.','한국 사람이에요? 네.','Você é coreano(a)? Sim.'],
['Apresentar-se','제 이름은 ...예요','je i-reu-meun ... ye-yo','Meu nome é...','제 이름은 é uma maneira educada de dizer “meu nome é”.','제 이름은 루카스예요.','Meu nome é Lucas.'],
['Países e nacionalidades','브라질 사람','beu-ra-jil sa-ram','Pessoa brasileira','Para dizer que é de um país, use país + 사람.','저는 브라질 사람이에요.','Sou brasileiro(a).'],
['Contar idade','살','sal','Anos de idade','살 é usado com números nativos para idade em conversas comuns.','스무 살이에요.','Tenho vinte anos.'],
['Datas e números','이천이십육 년','i-cheon-i-sip-yuk nyeon','Ano de 2026','Datas usam números sino-coreanos. 년 significa ano, 월 mês e 일 dia.','오늘은 11월 26일이에요.','Hoje é 26 de novembro.'],
['Dias da semana','월 화 수 목 금 토 일','wol, hwa, su, mok, geum, to, il','Dias da semana','Os nomes completos terminam em 요일: 월요일, 화요일 e assim por diante.','금요일에 만나요.','Vamos nos encontrar na sexta-feira.'],
['Hoje, amanhã e ontem','오늘, 내일, 어제','o-neul, nae-il, eo-je','Expressões de tempo','오늘 é hoje, 내일 é amanhã e 어제 é ontem.','내일 만나요.','Nos vemos amanhã.'],
['Frases simples','저는 물을 마셔요','jeo-neun mu-reul ma-syeo-yo','Eu bebo água','은/는 marca o tópico e 을/를 marca o objeto da ação.','저는 커피를 마셔요.','Eu bebo café.'],
['Revisão final','한국어를 배워요','han-gu-geo-reul bae-wo-yo','Aprendo coreano','Parabéns! Revise as letras, saudações, números e frases simples.','조금씩 매일 공부해요.','Estudo um pouquinho todos os dias.']
];
const vocab=[['안녕하세요','Olá','an-nyeong-ha-se-yo'],['감사합니다','Obrigado(a)','gam-sa-ham-ni-da'],['사랑','Amor','sa-rang'],['친구','Amigo(a)','chin-gu'],['물','Água','mul'],['밥','Arroz / refeição','bap'],['학교','Escola','hak-kkyo'],['책','Livro','chaek'],['집','Casa','jip'],['가족','Família','ga-jok'],['네','Sim','ne'],['아니요','Não','a-ni-yo']];
let xp=Number(localStorage.getItem('xp')||0);let completed;try{completed=JSON.parse(localStorage.getItem('completed')||'[]')}catch(e){completed=[]}if(!Array.isArray(completed))completed=[];let tab='inicio';let current=0;let quizIndex=0;let quizCorrect=0;
function save(){localStorage.setItem('xp',String(xp));localStorage.setItem('completed',JSON.stringify(completed));stats()}
function stats(){document.getElementById('xp').textContent=xp;document.getElementById('done').textContent=completed.length+'/50';document.getElementById('level').textContent=Math.floor(xp/100)+1}
function finish(i){if(!completed.includes(i)){completed.push(i);xp+=10;save()}render('licoes')}
function openLesson(i){current=i;render('detail')}
function render(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));const c=document.getElementById('content');if(t==='inicio'){let pct=Math.round(completed.length/50*100);let next=lessons.findIndex((_,i)=>!completed.includes(i));c.innerHTML=`<div class="card"><h2>Bem-vindo(a)! 💜</h2><p>Aprenda coreano passo a passo, começando pelo alfabeto e avançando até frases do dia a dia.</p><h3>Seu progresso: ${pct}%</h3><div class="progress"><div style="width:${pct}%"></div></div><p class="muted small">${completed.length} de 50 lições concluídas</p><button class="btn primary" onclick="openLesson(${next<0?0:next})">${next<0?'Revisar lições':'Continuar aprendendo'}</button></div><div class="card"><h3>✨ Dica do dia</h3><div class="word">안녕하세요</div><p>an-nyeong-ha-se-yo</p><p>Olá! A saudação mais útil para começar.</p></div>`}
else if(t==='hangul'){c.innerHTML=`<div class="card"><h2>O alfabeto coreano — 한글</h2><p>O Hangul é formado por consoantes e vogais agrupadas em blocos silábicos.</p><h3>Vogais</h3><div class="word">ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ</div><p class="muted">a · eo · o · u · eu · i</p><h3>Consoantes</h3><div class="word">ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ</div><p class="muted">g/k · n · d/t · r/l · m · b/p · s · som zero/ng</p><h3>Como formar um bloco</h3><div class="word">ㄱ + ㅏ = 가</div><p>Uma consoante inicial se combina com uma vogal para formar uma sílaba.</p><button class="btn primary" onclick="openLesson(30)">Começar as aulas de Hangul</button></div>`}
else if(t==='vocabulario'){c.innerHTML='<div class="card"><h2>Vocabulário essencial</h2><p class="muted">Palavras para começar a reconhecer e memorizar.</p></div>'+vocab.map(v=>`<div class="card"><div class="word">${v[0]}</div><div class="pron">${v[2]}</div><p>${v[1]}</p></div>`).join('')}
else if(t==='licoes'){c.innerHTML='<div class="card"><h2>📚 Todas as lições</h2><p class="muted">50 lições do básico ao primeiro conjunto de frases.</p></div>'+lessons.map((l,i)=>`<div class="card lesson"><div><h3>${i+1}. ${l[0]}</h3><p class="muted small">${l[1]} · ${l[3]}</p></div><div><span class="tag">${completed.includes(i)?'Concluída':'10 XP'}</span><br><button class="btn ${completed.includes(i)?'':'primary'}" style="margin-top:7px" onclick="openLesson(${i})">${completed.includes(i)?'Rever':'Estudar'}</button></div></div>`).join('')}
else if(t==='detail'){let l=lessons[current];c.innerHTML=`<div class="card"><button class="btn" onclick="render('licoes')">← Voltar às lições</button><p class="muted">LIÇÃO ${current+1} DE 50</p><h2>${l[0]}</h2><div class="word">${l[1]}</div><div class="pron">${l[2]}</div><h3>${l[3]}</h3><p>${l[4]}</p><div class="card" style="background:#f7f7fc"><b>Exemplo</b><div class="word" style="font-size:23px">${l[5]}</div><p>${l[6]}</p></div><div class="notice">Leia a palavra coreana em voz alta e tente repetir o exemplo.</div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="finish(${current})">${completed.includes(current)?'Concluída ✓':'Concluir lição (+10 XP)'}</button><button class="btn" onclick="openLesson(${Math.min(49,current+1)})">Próxima →</button></div></div>`}
else if(t==='quiz'){let q=vocab[quizIndex%vocab.length];let opts=[q[1],vocab[(quizIndex+3)%vocab.length][1],vocab[(quizIndex+7)%vocab.length][1]].sort(()=>Math.random()-.5);c.innerHTML=`<div class="card"><h2>🎯 Quiz de vocabulário</h2><p class="muted">Qual é o significado desta palavra?</p><div class="word">${q[0]}</div><div class="pron">${q[2]}</div>${opts.map(o=>`<button class="answer" onclick="answerQuiz(this,${JSON.stringify(o)},${JSON.stringify(q[1])})">${o}</button>`).join('')}<p id="quizFeedback" class="muted small">Cada resposta correta vale 5 XP.</p><button class="btn" onclick="render('quiz')">Outra pergunta</button></div>`}}
function answerQuiz(btn,choice,correct){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let f=document.getElementById('quizFeedback');if(choice===correct){xp+=5;save();f.textContent='Muito bem! +5 XP 🎉';f.className='notice'}else{f.textContent='Quase! A resposta correta é: '+correct;f.className='muted'}quizIndex++}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));stats();render('inicio');
</script></body></html>
